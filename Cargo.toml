[package]
name = "taskbar-audio"
version = "1.0.0"
edition = "2021"
description = "Volume, active audio device, per-app mixer, and call indicator on the Windows taskbar"
license = "MIT"
repository = "https://github.com/vinny/windows-taskbar-audio"

[[bin]]
name = "taskbar-audio"
path = "src/main.rs"

[features]
# Standard standalone GitHub/WinGet distribution:
# - self-update: built-in GitHub Releases updater with SHA-256 verification
# - taskbar-inject: embeds widget directly into Shell_TrayWnd (Windows 11 taskbar)
default = ["self-update", "taskbar-inject"]
self-update = []
taskbar-inject = []
# Microsoft Store (MSIX) compliant profile:
# disables self-update & taskbar injection, uses official Shell_NotifyIconW + StartupTask consent model
store = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
resvg = "0.44"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
