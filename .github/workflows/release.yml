name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            asset_name: taskbar-audio.exe
          - target: aarch64-pc-windows-msvc
            asset_name: taskbar-audio-arm64.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Stage release binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\taskbar-audio.exe" "dist\${{ matrix.asset_name }}"
      - name: Build Store MSIX package
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.target }}" -like "aarch64*") { "arm64" } else { "x64" }
          .\packaging\msix\pack-msix.ps1 -Arch $arch
          Copy-Item "taskbar-audio-$arch.msix" "dist\taskbar-audio-$arch.msix"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist\*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -Path dist\SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.msix
            dist/SHA256SUMS.txt
          generate_release_notes: true
